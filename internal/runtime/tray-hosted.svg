<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="IntraFlow hosting active">
  <!--
    macOS menu-bar TEMPLATE image (HOSTED / 托管中).
    The open gateway is the public entry point and the continuous arrow is
    traffic being routed to the internal target. The 5px stroke and the
    8..56 / 9..55 silhouette are intentionally sized for a 16pt status item.
    Keep all visible pixels pure black; macOS supplies the template tint.
  -->
  <path
    d="M31 11H18c-4.4 0-8 3.6-8 8v26c0 4.4 3.6 8 8 8h13"
    fill="none"
    stroke="#000000"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <path
    d="M30 32H47"
    fill="none"
    stroke="#000000"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <path
    d="M43 22L56 32L43 42Z"
    fill="#000000"
    stroke="#000000"
    stroke-width="1"
    stroke-linejoin="round"/>
</svg>
