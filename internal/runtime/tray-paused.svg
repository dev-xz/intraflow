<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="IntraFlow hosting paused">
  <!--
    macOS menu-bar TEMPLATE image (PAUSED / 已暂停).
    Solid black only; anti-aliased through alpha and re-tinted by macOS.

    Metaphor: the SAME globe as tray-hosted.svg, drawn as an outline and
    cancelled by a clean diagonal slash — unmistakably the "off" state of the
    hosted icon while staying in the same visual family.
    A knockout gap (transparent channel) separates the slash from the globe so
    neither element muddies the other at 16pt.
  -->
  <defs>
    <mask id="ifPausedGap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="0" y="0" width="64" height="64" fill="#ffffff"/>
      <line x1="12" y1="52" x2="52" y2="12" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#ifPausedGap)" fill="none" stroke="#000000">
    <circle cx="32" cy="32" r="21" stroke-width="4.5"/>
    <ellipse cx="32" cy="32" rx="21" ry="8" stroke-width="3.2"/>
  </g>
  <line x1="12" y1="52" x2="52" y2="12" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
</svg>
